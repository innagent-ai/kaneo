  <!-- A PORTA da família Inn — o splash antes do bundle. Estilo no <head> e
       marca no topo do <body>: pinta no PRIMEIRO quadro, sem esperar rede (o
       símbolo vai embutido, nunca por <img src>). Some sozinho quando o React
       monta em #root — `:has()` já é pré-requisito do próprio app. -->
  <style>
    #inn-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #EEF3F9;
    }
    body:has(#root > *) #inn-splash {
      display: none;
    }
  </style>
</head>
